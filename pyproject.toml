[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficflow"
version = "0.2.0"
description = "TrafficFlow — vehicle counting platform (API + worker + AI engine)."
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "opencv-python==4.11.0.86",
    "numpy",
]

[project.optional-dependencies]
worker = [
    "celery",
    "redis",
    "requests",
    "urllib3",
]
api = [
    # Keep the router/lifespan behavior stable across deployments. FastAPI
    # 0.116+ currently pulls a new Starlette routing implementation that is
    # not compatible with this project's nested APIRouter layout.
    "fastapi>=0.115.6,<0.116",
    "uvicorn>=0.32,<0.34",
    "motor",
    "apscheduler",
    "boto3",
    "python-multipart",
    "yt-dlp",
]
gpu = [
    "ultralytics",
    "lap>=0.5.12",
    "scipy",
    "torch",
    "torchvision",
]
dev = [
    "pytest",
    "psutil",
    "httpx>=0.27,<0.29",
]
benchmark = [
    "trackeval==1.3.0",
    "pycocotools>=2.0.10",
    "tabulate>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "tfengine",
    "tfengine.runtime*",
    "tfengine.core_ai*",
    "tfengine.counting*",
    "tfengine.geometry*",
    "tfengine.pipeline*",
    "tfengine.cli*",
]

[tool.setuptools.package-data]
tfengine = ["py.typed"]
