[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficflow"
version = "0.2.0"
description = "TrafficFlow — vehicle counting platform (API + worker + AI engine)."
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "opencv-python==4.10.0.84",
    "numpy",
]

[project.optional-dependencies]
worker = [
    "celery",
    "redis",
    "requests",
    "urllib3",
]
api = [
    "fastapi",
    "uvicorn",
    "motor",
    "apscheduler",
    "boto3",
    "certifi",
    "python-multipart",
    "python-magic>=0.4.27",
    "yt-dlp",
    "pydantic-settings",
    "python-dotenv",
]
benchmark = [
    "scipy",
]
gpu = [
    "ultralytics",
    "lap>=0.5.12",
    "scipy",
    "torch",
    "torchvision",
]
dev = [
    "pytest",
    "pytest-cov",
    "psutil",
    "httpx>=0.27",
    "ruff>=0.6",
    "bandit>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "api*",
    "shared*",
    "worker*",
    "tfengine",
    "tfengine.runtime*",
    "tfengine.core_ai*",
    "tfengine.counting*",
    "tfengine.geometry*",
    "tfengine.pipeline*",
    "tfengine.cli*",
]

[tool.setuptools.package-data]
tfengine = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
